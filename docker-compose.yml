services:
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: sharesentinel-worker
    tmpfs:
      - /tmp/sharesentinel:size=12G,mode=1777
    environment:
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sharesentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sharesentinel}

      # Microsoft Graph API
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CERTIFICATE=/app/certs/graph-api-cert.pfx
      - AZURE_CERTIFICATE_PASS=${AZURE_CERTIFICATE_PASS}

      # AI Provider
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - VERTEX_PROJECT=${VERTEX_PROJECT}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-1024}

      # Second-Look AI Review
      - SECOND_LOOK_ENABLED=${SECOND_LOOK_ENABLED:-false}
      - SECOND_LOOK_PROVIDER=${SECOND_LOOK_PROVIDER:-gemini}
      - SECOND_LOOK_MODEL=${SECOND_LOOK_MODEL:-gemini-3.1-pro-preview}

      # Processing
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-5}
      - MAX_CONCURRENT_AV_JOBS=${MAX_CONCURRENT_AV_JOBS:-2}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-52428800}
      - MAX_AV_FILE_SIZE_BYTES=${MAX_AV_FILE_SIZE_BYTES:-1610612736}
      - TEXT_CONTENT_LIMIT=${TEXT_CONTENT_LIMIT:-100000}
      - HASH_REUSE_DAYS=${HASH_REUSE_DAYS:-30}

      # Transcription (audio/video pipeline)
      - TRANSCRIPTION_ENABLED=${TRANSCRIPTION_ENABLED:-true}
      - GRAPH_TRANSCRIPT_TIMEOUT_SECONDS=${GRAPH_TRANSCRIPT_TIMEOUT_SECONDS:-30}
      - WHISPER_ENABLED=${WHISPER_ENABLED:-true}
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - WHISPER_SERVICE_URL=${WHISPER_SERVICE_URL:-http://transcriber:8090}

      # Notifications
      - ANALYST_NOTIFICATION_ENABLED=${ANALYST_NOTIFICATION_ENABLED:-true}
      - NOTIFICATION_CHANNELS=${NOTIFICATION_CHANNELS:-email}
      - NOTIFY_ON_FOLDER_SHARE=${NOTIFY_ON_FOLDER_SHARE:-true}
      - NOTIFY_ON_FAILURE=${NOTIFY_ON_FAILURE:-true}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}

      # Security / remediation
      - SECURITY_EMAIL=${SECURITY_EMAIL:-}
      # Immediate single-site remediation on out-of-policy share-link events
      - EVENT_REMEDIATION_ENABLED=${EVENT_REMEDIATION_ENABLED:-false}

      # User notifications (post-disposition emails to file owners)
      - USER_NOTIFICATION_ENABLED=${USER_NOTIFICATION_ENABLED:-false}
      - USER_NOTIFICATION_OVERRIDE_EMAIL=${USER_NOTIFICATION_OVERRIDE_EMAIL:-}
      - USER_NOTIFICATION_BCC=${USER_NOTIFICATION_BCC:-}
      - USER_NOTIFICATION_AI_PROVIDER=${USER_NOTIFICATION_AI_PROVIDER:-}
      - USER_NOTIFICATION_AI_MODEL=${USER_NOTIFICATION_AI_MODEL:-}

      # Jira (Phase 2)
      - JIRA_URL=${JIRA_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY}
      - JIRA_ISSUE_TYPE=${JIRA_ISSUE_TYPE:-Task}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ${AZURE_CERTIFICATE:-./graph-api-cert.pfx}:/app/certs/graph-api-cert.pfx:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sharesentinel
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  transcriber:
    build:
      context: ./services/transcriber
      dockerfile: Dockerfile
    container_name: sharesentinel-transcriber
    tmpfs:
      - /tmp/transcriber:size=8G,mode=1777
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - MODEL_CACHE_DIR=/models
      - TMPFS_PATH=/tmp/transcriber
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - whisper_models:/models
    restart: unless-stopped
    networks:
      - sharesentinel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sharesentinel-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sharesentinel
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:443/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: sharesentinel-dashboard
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sharesentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sharesentinel}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

      # Microsoft Graph API (site search for allowlist)
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CERTIFICATE=/app/certs/graph-api-cert.pfx
      - AZURE_CERTIFICATE_PASS=${AZURE_CERTIFICATE_PASS}

      # Entra ID SSO (OpenID Connect)
      - OIDC_TENANT_ID=${OIDC_TENANT_ID}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:8080/api/auth/callback}
      - OIDC_ALLOWED_GROUP_IDS=${OIDC_ALLOWED_GROUP_IDS}
      - OIDC_ADMIN_GROUP_IDS=${OIDC_ADMIN_GROUP_IDS:-}
      - OIDC_ANALYST_GROUP_IDS=${OIDC_ANALYST_GROUP_IDS:-}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - AUTH_DISABLED=${AUTH_DISABLED:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:8080}

      # AI Provider (for content inspection)
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-1024}
      - TEXT_CONTENT_LIMIT=${TEXT_CONTENT_LIMIT:-100000}

      # Browser auth (SharePoint root for cookie capture)
      - SHAREPOINT_ROOT_URL=${SHAREPOINT_ROOT_URL:-https://www.office.com}

      # Company-wide sharing exception group (read-only display of members)
      - COMPANY_WIDE_SHARING_EXCEPTION_GROUP_ID=${COMPANY_WIDE_SHARING_EXCEPTION_GROUP_ID:-}
      - COMPANY_WIDE_SHARING_DRY_RUN=${COMPANY_WIDE_SHARING_DRY_RUN:-true}
    volumes:
      - ./config:/app/config:ro
      - ${AZURE_CERTIFICATE:-./graph-api-cert.pfx}:/app/certs/graph-api-cert.pfx:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sharesentinel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  lifecycle-cron:
    build:
      context: .
      dockerfile: services/lifecycle-cron/Dockerfile
    container_name: sharesentinel-lifecycle-cron
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sharesentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sharesentinel}

      # Direct Postgres env vars (used by PowerShell Invoke-Psql helper when
      # IN_CONTAINER=true so PS scripts can hit Postgres without `docker exec`).
      - IN_CONTAINER=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-sharesentinel}
      - POSTGRES_DB=${POSTGRES_DB:-sharesentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      # Redis (audit log poller)
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

      # Microsoft Graph API
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CERTIFICATE=/app/certs/graph-api-cert.pfx
      - AZURE_CERTIFICATE_PASS=${AZURE_CERTIFICATE_PASS}

      # Notifications
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - EMAIL_FROM=${EMAIL_FROM}
      - SECURITY_EMAIL=${SECURITY_EMAIL:-}

      # Lifecycle settings
      - LIFECYCLE_CHECK_INTERVAL_HOURS=${LIFECYCLE_CHECK_INTERVAL_HOURS:-24}
      - LIFECYCLE_MAX_DAYS=${LIFECYCLE_MAX_DAYS:-180}
      - LIFECYCLE_NOTIFICATIONS_ENABLED=${LIFECYCLE_NOTIFICATIONS_ENABLED:-true}

      # Audit log polling
      - AUDIT_POLL_ENABLED=${AUDIT_POLL_ENABLED:-true}
      - AUDIT_POLL_INTERVAL_MINUTES=${AUDIT_POLL_INTERVAL_MINUTES:-15}
      # Also ingest SiteCollectionCreated / "Add group." / "Add user." events
      # so new sites, OneDrives, and groups are policy-enforced on creation.
      # Requires AuditLogsQuery.Read.All (not just the SharePoint variant).
      - AUDIT_POLL_PROVISIONING_ENABLED=${AUDIT_POLL_PROVISIONING_ENABLED:-false}

      # Site policy enforcement (dual: visibility + sharing)
      - SITE_POLICY_ENABLED=${SITE_POLICY_ENABLED:-false}
      - SITE_POLICY_INTERVAL_HOURS=${SITE_POLICY_INTERVAL_HOURS:-24}
      - SITE_POLICY_ENABLED_SHARING_CAPABILITY=${SITE_POLICY_ENABLED_SHARING_CAPABILITY:-ExternalUserAndGuestSharing}
      - SITE_POLICY_DISABLED_SHARING_CAPABILITY=${SITE_POLICY_DISABLED_SHARING_CAPABILITY:-ExternalUserSharingOnly}
      # Include OneDrive personal sites in the scheduled sharing scan
      - SITE_POLICY_INCLUDE_ONEDRIVE=${SITE_POLICY_INCLUDE_ONEDRIVE:-true}
      - SHAREPOINT_ADMIN_URL=${SHAREPOINT_ADMIN_URL}

      # Folder rescan
      - FOLDER_RESCAN_ENABLED=${FOLDER_RESCAN_ENABLED:-true}
      - FOLDER_RESCAN_INTERVAL_HOURS=${FOLDER_RESCAN_INTERVAL_HOURS:-168}
      - FOLDER_RESCAN_BATCH_SIZE=${FOLDER_RESCAN_BATCH_SIZE:-50}

      # Company-wide sharing exception group (members of this Entra group are
      # exempt from CWS enforcement on their OneDrive). Shared by every CWS
      # PowerShell script.
      - COMPANY_WIDE_SHARING_EXCEPTION_GROUP_ID=${COMPANY_WIDE_SHARING_EXCEPTION_GROUP_ID:-}

      # CWS verification sweep (detect-only, PowerShell-based)
      - CWS_VERIFICATION_ENABLED=${CWS_VERIFICATION_ENABLED:-false}
      - CWS_VERIFICATION_INTERVAL_HOURS=${CWS_VERIFICATION_INTERVAL_HOURS:-168}

      # CWS drift remediation (daily, drains cws_verification_events)
      - CWS_DRIFT_REMEDIATION_ENABLED=${CWS_DRIFT_REMEDIATION_ENABLED:-false}
      - CWS_DRIFT_REMEDIATION_INTERVAL_HOURS=${CWS_DRIFT_REMEDIATION_INTERVAL_HOURS:-24}
      - CWS_DRIFT_REMEDIATION_DRY_RUN=${CWS_DRIFT_REMEDIATION_DRY_RUN:-true}

      # CWS bulk remediation (monthly full-tenant safety net)
      - CWS_BULK_REMEDIATION_ENABLED=${CWS_BULK_REMEDIATION_ENABLED:-false}
      - CWS_BULK_REMEDIATION_INTERVAL_HOURS=${CWS_BULK_REMEDIATION_INTERVAL_HOURS:-720}
      - CWS_BULK_REMEDIATION_DRY_RUN=${CWS_BULK_REMEDIATION_DRY_RUN:-true}
      - CWS_BULK_REMEDIATION_THROTTLE=${CWS_BULK_REMEDIATION_THROTTLE:-5}

      # CWS allowlist-action consumer (drains dashboard add/remove triggers)
      - CWS_ALLOWLIST_ACTION_ENABLED=${CWS_ALLOWLIST_ACTION_ENABLED:-true}

      # CWS exception-group sync (short-interval Graph poll, PS only on diff)
      - CWS_EXCEPTION_GROUP_SYNC_ENABLED=${CWS_EXCEPTION_GROUP_SYNC_ENABLED:-false}
      - CWS_EXCEPTION_GROUP_SYNC_INTERVAL_MINUTES=${CWS_EXCEPTION_GROUP_SYNC_INTERVAL_MINUTES:-10}
      - CWS_EXCEPTION_GROUP_SYNC_DRY_RUN=${CWS_EXCEPTION_GROUP_SYNC_DRY_RUN:-true}
      - CWS_EXCEPTION_RECONCILE_INTERVAL_HOURS=${CWS_EXCEPTION_RECONCILE_INTERVAL_HOURS:-24}

      # CWS failure diagnostic (wraps SharePoint-Oversharing-Toolkit's
      # Diagnose-OneDriveSite.ps1 to explain why a Set-PnPTenantSite call
      # failed, e.g. locked OneDrive, license cap, deleted user)
      - CWS_FAILURE_DIAGNOSTIC_ENABLED=${CWS_FAILURE_DIAGNOSTIC_ENABLED:-true}
      - CWS_FAILURE_DIAGNOSTIC_INTERVAL_MINUTES=${CWS_FAILURE_DIAGNOSTIC_INTERVAL_MINUTES:-30}
      - CWS_FAILURE_DIAGNOSTIC_MAX_PER_SWEEP=${CWS_FAILURE_DIAGNOSTIC_MAX_PER_SWEEP:-20}
      - CWS_FAILURE_DIAGNOSTIC_REFRESH_AFTER_HOURS=${CWS_FAILURE_DIAGNOSTIC_REFRESH_AFTER_HOURS:-72}
      - TOOLKIT_PATH=/opt/toolkit

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ${AZURE_CERTIFICATE:-./graph-api-cert.pfx}:/app/certs/graph-api-cert.pfx:ro
      # SharePoint-Oversharing-Toolkit checkout (Diagnose-OneDriveSite.ps1 etc.).
      # Set TOOLKIT_HOST_PATH in .env to enable the CWS failure diagnostic. When
      # unset, the mount points at an empty /tmp dir and the wrapper records
      # diagnostic_unavailable instead of crashing.
      - ${TOOLKIT_HOST_PATH:-/tmp/sharesentinel-no-toolkit}:/opt/toolkit:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sharesentinel
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  watchdog:
    build:
      context: .
      dockerfile: services/watchdog/Dockerfile
    container_name: sharesentinel-watchdog
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sharesentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sharesentinel}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - WATCHDOG_CHECK_INTERVAL_SECONDS=${WATCHDOG_CHECK_INTERVAL_SECONDS:-120}
      - WATCHDOG_HEARTBEAT_STALE_SECONDS=${WATCHDOG_HEARTBEAT_STALE_SECONDS:-300}
      - WATCHDOG_POLL_STALE_SECONDS=${WATCHDOG_POLL_STALE_SECONDS:-3600}
      - WATCHDOG_AUTO_RESTART=${WATCHDOG_AUTO_RESTART:-true}
      - LIFECYCLE_CONTAINER_NAME=sharesentinel-lifecycle-cron
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sharesentinel
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: sharesentinel-redis
    # noeviction: this Redis backs the job queue, dedup keys, CWS exemption
    # set, and dashboard sessions (incl. Graph tokens). allkeys-lru could
    # silently evict queued jobs or the exemption set under memory pressure;
    # with noeviction, writes fail loudly instead. Usage is ~2MB of 128MB.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sharesentinel
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Daily plaintext pg_dump to ./backups (gitignored) with 14-day retention.
  # Backups contain sensitive verdict/PII data — see docs/review-data-handling.md.
  db-backup:
    image: postgres:16-alpine
    container_name: sharesentinel-db-backup
    environment:
      - PGHOST=postgres
      - PGDATABASE=${POSTGRES_DB:-sharesentinel}
      - PGUSER=${POSTGRES_USER:-sharesentinel}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_INTERVAL_HOURS=${DB_BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION_DAYS=${DB_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        echo "[db-backup] dumping to /backups/sharesentinel_$$ts.sql.gz";
        pg_dump | gzip > "/backups/sharesentinel_$$ts.sql.gz" &&
          echo "[db-backup] done" || echo "[db-backup] FAILED";
        find /backups -name "sharesentinel_*.sql.gz" -mtime +$$BACKUP_RETENTION_DAYS -delete;
        sleep $$(( BACKUP_INTERVAL_HOURS * 3600 ));
      done'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sharesentinel

  postgres:
    image: postgres:16-alpine
    container_name: sharesentinel-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sharesentinel}
      - POSTGRES_USER=${POSTGRES_USER:-sharesentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    restart: unless-stopped
    networks:
      - sharesentinel
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sharesentinel} -d ${POSTGRES_DB:-sharesentinel}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  redis_data:
  postgres_data:
  whisper_models:

networks:
  sharesentinel:
    driver: bridge
