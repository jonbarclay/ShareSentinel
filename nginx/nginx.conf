worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Rate limiting zone: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Docker's embedded DNS. Combined with variable upstreams in proxy_pass,
    # nginx re-resolves container names at request time instead of caching the
    # IP at startup — so recreating the dashboard container no longer leaves
    # nginx proxying to a stale IP (502 until nginx restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 443 ssl;
        server_name sharesentinel.yourorg.com;

        # TLS certificates
        ssl_certificate     /etc/nginx/certs/sharesentinel.crt;
        ssl_certificate_key /etc/nginx/certs/sharesentinel.key;

        # TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP: the React bundle is self-hosted; the dashboard renders
        # attacker-influenceable strings (file names, AI summaries), so block
        # external script/object sources outright. 'unsafe-inline' styles are
        # required by the current Vite build; images allow data: for icons.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

        # Rate limiting
        limit_req zone=general burst=20 nodelay;

        # /oversharing-report without a trailing slash doesn't match the
        # location below (which requires the slash); without this exact-match
        # redirect the request would fall through to the dashboard catch-all.
        location = /oversharing-report {
            return 301 /oversharing-report/;
        }

        # Oversharing report — separate container reading the delta-pipeline
        # SQLite DB. Variable upstream forces per-request DNS resolution; the
        # rewrite strips the /oversharing-report/ prefix (variable proxy_pass
        # can't carry a URI part) so the backend sees /api/... and /.
        location /oversharing-report/ {
            set $oversharing_upstream http://oversharing-report:8081;
            rewrite ^/oversharing-report/(.*)$ /$1 break;
            proxy_pass $oversharing_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        location / {
            set $dashboard_upstream http://dashboard:8080;
            proxy_pass $dashboard_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }
    }
}
